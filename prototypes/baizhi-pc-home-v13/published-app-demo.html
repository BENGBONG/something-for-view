<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用页面示例</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#263247;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:white;border-bottom:1px solid #e5e9ef;padding:22px 40px;display:flex;justify-content:space-between;align-items:center}a{color:#165dff;text-decoration:none;font-size:13px}main{max-width:1100px;margin:48px auto;padding:0 28px}.label{font-size:12px;color:#165dff}h1{font-size:32px;margin:14px 0}p{font-size:14px;color:#8691a2;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}.card{padding:24px;background:white;border:1px solid #e4e9f1;border-radius:12px}.card strong{display:block;font-size:28px;margin-top:14px}.panel{background:white;border:1px solid #e4e9f1;border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th,td{padding:15px 20px;border-bottom:1px solid #edf0f5}th{background:#fafbfe;color:#8390a2;font-weight:500}.note{margin-top:28px;font-size:12px}.badge{background:#eef8f3;color:#29835b;border-radius:4px;padding:4px 9px;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}header{padding:20px}}
</style></head><body><header><strong>百智应用</strong><a href="index.html?edition=enterprise&page=capabilities&tab=applications">返回应用目录</a></header><main><span class="label">独立应用页面 · 原型示例</span><h1 id="title"></h1><p id="description"></p><div class="grid" id="metrics"></div><div class="panel"><table><thead><tr id="columns"></tr></thead><tbody id="rows"></tbody></table></div><p class="note">此页仅用于演示“点击应用 → 打开发布页面”的交互，不代表 Agent Platform 的真实发布结果，也没有连接业务数据。</p></main><script>
const examples={sales:{name:'销售洞察',desc:'把客户信息和商机进展汇总为清晰的销售视图。',metrics:[['重点客户','8'],['有效商机','9'],['成交金额','62 万']],columns:['客户','当前阶段','负责人','预计金额'],rows:[['东辰商业','方案报价','张伟','350,000'],['华悦零售','需求确认','张伟','180,000'],['苏城百货','试点推进','张伟','90,000']]},leads:{name:'客户商机',desc:'跟踪线索与下一步行动。',metrics:[['待跟进线索','12'],['本周新增','4'],['已安排演示','3']],columns:['客户','线索来源','下一步行动','计划日期'],rows:[['东辰商业','销售录音','安排产品演示','2026-09-18'],['远景零售','客户推荐','需求沟通','2026-09-19']]},delivery:{name:'项目交付',desc:'查看项目进度、里程碑与交付风险。',metrics:[['进行中项目','6'],['本月待验收','2'],['待处理问题','3']],columns:['项目','阶段','计划验收','状态'],rows:[['门店数据试点','实施中','2026-09-30','正常'],['客户画像建设','联调中','2026-10-12','待确认']]}};
const app=examples[new URLSearchParams(location.search).get('app')];
if(!app){document.querySelector('#title').textContent='应用不存在';document.querySelector('#description').textContent='请返回目录选择应用。';}else{document.title=app.name+' · 应用页面示例';document.querySelector('#title').textContent=app.name;document.querySelector('#description').textContent=app.desc;document.querySelector('#metrics').innerHTML=app.metrics.map(([name,n])=>'<div class="card"><span>'+name+'</span><strong>'+n+'</strong></div>').join('');document.querySelector('#columns').innerHTML=app.columns.map(c=>'<th>'+c+'</th>').join('');document.querySelector('#rows').innerHTML=app.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');}
</script></body></html>
