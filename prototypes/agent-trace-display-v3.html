  /* ===== 严格还原截图规范: 浅紫底 / 裸 chevron / 扁平浅灰紫事件行 / 白卡 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f4fa; color: #2a2839; }

  .ts-top { text-align: right; font-size: 12px; color: #a8a6be; margin-bottom: 10px; }

  /* Agent 身份行 + 分隔线(与截图一致) */
  .agent-row { display: flex; align-items: center; gap: 10px; padding-bottom: 14px;
               border-bottom: 1px solid #e6e4f0; margin-bottom: 6px; }
  .agent-ava { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#7c6ff0,#a89cff);
               color: #fff; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .agent-name { font-size: 15px; font-weight: 600; color: #23213a; }

  /* 执行过程外层折叠容器(完成后默认收起) */
  .process { margin: 4px 0 2px; }
  .process-head { display: flex; align-items: center; gap: 8px; padding: 12px 2px; cursor: pointer; user-select: none; }
  .process-head .chev { font-size: 12px; color: #6f6c8e; width: 14px; transition: transform .15s; }
  .process:not(.open) .process-head .chev { transform: rotate(-90deg); }
  .process-title { font-size: 15px; font-weight: 600; color: #23213a; }
  .process-sub { font-size: 11.5px; color: #b3b1c7; }
  .process-body { display: none; }
  .process.open .process-body { display: block; }

  /* 阶段分组头: 裸 chevron + 加粗深色标题(截图规范) */
  .phase { margin: 2px 0; }
  .phase-head { display: flex; align-items: center; gap: 8px; padding: 12px 2px; cursor: pointer; user-select: none; }
  .chev { font-size: 12px; color: #6f6c8e; width: 14px; flex-shrink: 0; transition: transform .15s; }
  .phase:not(.open) .chev { transform: rotate(-90deg); }
  .phase-title { font-size: 15px; font-weight: 600; color: #23213a; }
  .phase-sub { font-size: 11.5px; color: #b3b1c7; margin-left: 2px; }
  .phase-badge-warn { font-size: 11.5px; color: #cf5a4a; margin-left: 2px; }
  .phase-body { display: none; padding: 0 0 10px 22px; }
  .phase.open .phase-body { display: block; }

  /* 工具调用行: 截图规范 = 浅灰紫文字 + 行尾 ›, 无底色无 chip */
  .call { display: flex; align-items: baseline; gap: 6px; padding: 7px 2px; font-size: 13px;
          color: #a2a0ba; cursor: pointer; border-radius: 6px; }
  .call:hover { background: #efedf6; }
  .call .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .call .chev-r { color: #b9b7cd; font-size: 12px; flex-shrink: 0; }
  .call.fail { color: #cf5a4a; }
  .call.fail .chev-r { color: #cf5a4a; }

  /* 展开详情(点击行展开, 白底细边) */
  .call-detail { display: none; margin: 2px 0 8px; padding: 10px 14px; background: #fff;
                 border: 1px solid #e6e4f0; border-radius: 10px; font-size: 12px; color: #6d6a8c; }
  .call-detail.open { display: block; }
  .call-detail .q { padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .call-detail .note { color: #1a9e56; margin-top: 4px; }
  .call-detail .meta-line { color: #b3b1c7; margin-top: 4px; font-size: 11.5px; }
  .call-detail .err { color: #cf5a4a; background: #fdeeee; border-radius: 6px; padding: 6px 10px; margin-top: 6px;
                      font-family: ui-monospace, monospace; font-size: 11.5px; word-break: break-all; }

  /* HIL 卡(严格按截图: 白卡 + 裸 chevron + 加粗标题 + 右上展开图标) */
  .hil-card { margin: 10px 0; background: #fff; border-radius: 12px; padding: 15px 18px;
              box-shadow: 0 1px 2px rgba(42,40,57,.04); cursor: pointer; }
  .hil-head { display: flex; align-items: center; gap: 8px; }
  .hil-title { font-size: 14px; font-weight: 600; color: #23213a; }
  .hil-expand { margin-left: auto; color: #a8a6be; font-size: 12px; }
  .hil-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #f0eef8;
              font-size: 12.5px; color: #6d6a8c; }
  .hil-card.open .hil-body { display: block; }
  .hil-body .f { padding: 2px 0; }
  .hil-body .done { color: #1a9e56; margin-top: 8px; font-size: 12px; }

  /* 最终输出: 最外层消息区块(不属于任何阶段/卡片), markdown 渲染 */
  .final-block { margin-top: 18px; }
  .final-text { font-size: 13.5px; line-height: 1.8; color: #3d3a52; padding: 10px 2px 0; }
  .final-text h2 { font-size: 16px; font-weight: 600; color: #23213a; margin: 14px 0 8px; }
  .final-text h3 { font-size: 14px; font-weight: 600; color: #23213a; margin: 14px 0 6px; }
  .final-text p { margin: 6px 0; }
  .final-text ul, .final-text ol { padding-left: 20px; margin: 6px 0; }
  .final-text li { margin: 3px 0; }
  .final-text strong { color: #23213a; font-weight: 600; }
  .final-text code { background: #efedf6; border-radius: 4px; padding: 1px 6px; font-size: 12px;
                     font-family: ui-monospace, monospace; color: #534ab7; }
  .final-text hr { border: none; border-top: 1px solid #e6e4f0; margin: 12px 0; }
  .final-text table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12.5px; }
  .final-text th { background: #f2f1f8; color: #23213a; font-weight: 600; text-align: left;
                   padding: 7px 10px; border: 1px solid #e6e4f0; }
  .final-text td { padding: 7px 10px; border: 1px solid #e6e4f0; color: #4a4765; vertical-align: top; }

  /* 产物卡 / 总结卡(白卡, 平台原有组件) */
  .card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(42,40,57,.04); margin: 14px 0; }
  .card h3 { font-size: 14px; font-weight: 600; color: #23213a; margin-bottom: 12px; }
  .artifact { display: flex; align-items: center; gap: 10px; border: 1px solid #eceaf6; border-radius: 10px;

  .artifact .fi { width: 30px; height: 30px; border-radius: 8px; background: #e7f8ee; color: #1a9e56;

  .artifact .dl { margin-left: auto; color: #7c6ff0; font-size: 12.5px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

function renderMd(src) {
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = src.split('\n');
  let html = '', i = 0;
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*$/.test(ln)) { i++; continue; }
    if (/^---+$/.test(ln.trim())) { html += '<hr>'; i++; continue; }
    const h = ln.match(/^(#{2,4})\s+(.*)$/);
    if (h) { const lv = h[1].length; html += `<h${lv}>${inline(h[2])}</h${lv}>`; i++; continue; }
    if (/^\|/.test(ln.trim())) {
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i].trim())) { rows.push(lines[i].trim()); i++; }
      const cells = r => r.slice(1, -1).split('|').map(c => c.trim());
      html += '<table>';
      rows.forEach((r, ri) => {
        if (/^\|[\s\-|]+\|$/.test(r)) return;
        const tag = ri === 0 ? 'th' : 'td';
        html += '<tr>' + cells(r).map(c => `<${tag}>${inline(c)}</${tag}>`).join('') + '</tr>';
      });
      html += '</table>';
      continue;
    }
    if (/^- /.test(ln.trim())) {
      html += '<ul>';
      while (i < lines.length && /^- /.test(lines[i].trim())) {
        html += `<li>${inline(lines[i].trim().slice(2))}</li>`; i++;
      }
      html += '</ul>';
      continue;
    }
    if (/^\d+\. /.test(ln.trim())) {
      html += '<ol>';
      while (i < lines.length && /^\d+\. /.test(lines[i].trim())) {
        html += `<li>${inline(lines[i].trim().replace(/^\d+\. /, ''))}</li>`; i++;
      }
      html += '</ol>';
      continue;
    }
    html += `<p>${inline(ln)}</p>`; i++;
  }
  return html;
}

function callRow(c) {
  const isFail = c.ok === false;
  const d = c.detail || {};
  let inner = '';
  if (d.queries) inner += d.queries.map(q => `<div class="q">· ${esc(q)}</div>`).join('');
  if (d.tags) inner += `<div class="q">关键词：${esc(d.tags.join('、'))}</div>`;
  if (d.domains) inner += `<div class="q">目标域名：${esc(d.domains.join('、'))}</div>`;
  if (d.path) inner += `<div class="q">路径：${esc(d.path)}${d.size ? `（${d.size.toLocaleString()} 字符）` : ''}</div>`;
  if (d.filename) inner += `<div class="q">文件：${esc(d.filename)}</div>`;
  if (d.person_id) inner += `<div class="q">person_id：${esc(d.person_id)}</div>`;
  if (d.script) inner += `<div class="q">脚本：${esc(d.script)}</div>`;
  if (d.note) inner += `<div class="note">✓ ${esc(d.note)}</div>`;
  if (c.note) inner += `<div class="note">✓ ${esc(c.note)}</div>`;
  if (c.error) inner += `<div class="err">✗ ${esc(c.error)}</div>`;
  const metaBits = [];
  if (c.duration_s != null) metaBits.push(`耗时 ${c.duration_s}s`);
  if (c.result_bytes) metaBits.push(`结果 ${(c.result_bytes/1000).toFixed(1)}k 字符`);
  if (metaBits.length) inner += `<div class="meta-line">${metaBits.join(' · ')}</div>`;
  const detailHtml = inner ? `<div class="call-detail" id="d-${c.id}">${inner}</div>` : '';
  return `<div class="call ${isFail ? 'fail' : ''}" onclick="document.getElementById('d-${c.id}')?.classList.toggle('open')">
      <span class="ct">${esc(c.title)}</span><span class="chev-r">›</span>
    </div>${detailHtml}`;
}

let hilRendered = false;
function phaseBlock(ph, idx) {
  let body = '';
  for (const step of ph.steps) {
    if (ph.key === 'requirement' && !hilRendered && VM.hil.fields.length) {
      body += `<div class="hil-card" onclick="this.classList.toggle('open')">
        <div class="hil-head"><span class="chev" style="transform:none">▾</span><span class="hil-title">补充信息</span>
          <span class="hil-expand">⤢</span></div>
        <div class="hil-body">
          ${VM.hil.fields.map(f => `<div class="f">· ${esc(f)}</div>`).join('')}
          ${VM.hil.replied ? `<div class="done">✓ 用户已提交表单，任务继续执行</div>` : ''}
        </div></div>`;
      hilRendered = true;
    }
    for (const c of step.calls) body += callRow(c);
  }
  return `<div class="phase" id="ph${idx}">
    <div class="phase-head" onclick="document.getElementById('ph${idx}').classList.toggle('open')">
      <span class="chev">▾</span>
      <span class="phase-title">${esc(ph.title)}</span>
      <span class="phase-sub">${ph.rounds} 轮 · ${ph.call_count} 次调用</span>
    </div>
    <div class="phase-body">${body}</div>
  </div>`;
}
