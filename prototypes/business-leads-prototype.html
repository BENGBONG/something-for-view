<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>百智AI工作台 · 商机线索</title>
<style>
:root{
  --primary:#414EFF; --primary-deep:#2B42F7; --primary-hover:#3243E6; --primary-light:#EFF2FF; --primary-border:#D5DBFF;
  --bg:#F6F7F9; --card:#FFFFFF; --border:#ECEEF2; --border-dark:#E3E6EB;
  --text:#1D2129; --text-2:#4E5969; --text-3:#969AA3;
  --green:#16A34A; --green-bg:#ECFDF3; --green-border:#CDEBD9;
  --red:#EF4444; --red-bg:#FEF2F2;
  --blue:#2E6BE6; --blue-light:#F0F6FF; --blue-border:#D6E4FF;
  --gold-text:#B25E09; --gold-bg:#FFF7E6; --gold-border:#FFE7BA;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;font-size:13px;color:var(--text);background:var(--bg);overflow:hidden}
button{font-family:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D8DBE0;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#C2C6CD}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh}

/* ================= 一级侧边栏 ================= */
.side1{width:200px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:relative;transition:width .2s ease}
.logo-row{display:flex;align-items:center;gap:8px;padding:14px 14px 12px}
.logo-badge{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#8B6DFF,#3D2EFB);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.logo-text{font-size:14px;font-weight:600;flex:1;letter-spacing:.2px}
.side-collapse{color:var(--text-3);padding:3px;border-radius:5px;display:flex;cursor:pointer}
.side-collapse:hover{background:#F2F3F5}
.new-task{margin:0 12px 12px;height:34px;background:#DFE5FF;color:#3D55F5;border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px}
.new-task:hover{background:#CFD9FF}
.new-task .nt-right{display:flex;align-items:center;gap:3px;margin-left:2px;opacity:.75}
.nav{flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 10px;border-radius:8px;color:var(--text-2);font-size:13px;cursor:pointer;user-select:none}
.nav-item:hover{background:#F5F6F8}
.nav-item.active{background:var(--primary-light);color:var(--primary-deep);font-weight:500}
.nav-item .arrow{margin-left:auto;color:var(--text-3);display:flex}
.nav-sub{margin:0 10px 0 34px}
.nav-sub .nav-item{margin:0;padding:7px 12px;font-size:12.5px}
.nav-empty{margin:6px 10px 0 46px;font-size:12px;color:#C0C4CC}
.user-card{border-top:1px solid var(--border);padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.user-card:hover{background:#FAFBFC}
.avatar{width:32px;height:32px;border-radius:50%;background:#3D4A6B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;flex-shrink:0}
.user-meta{flex:1;min-width:0}
.user-name{font-size:13px;font-weight:500}
.user-org{font-size:11px;color:var(--text-3);margin-top:1px}
.user-badge{font-size:11px;color:var(--blue)}
.user-card .arrow{color:#C0C4CC;display:flex}
.side1.collapsed{width:56px}
.side1.collapsed .logo-row{padding-left:15px;padding-right:15px;justify-content:center}
.side1.collapsed .logo-text,
.side1.collapsed .new-task .new-task-label,
.side1.collapsed .new-task .nt-right,
.side1.collapsed .nav-item .nav-label,
.side1.collapsed .nav-item .arrow,
.side1.collapsed .nav-sub,
.side1.collapsed .nav-empty,
.side1.collapsed .user-meta,
.side1.collapsed .user-badge,
.side1.collapsed .user-card .arrow{display:none}
.side1.collapsed .side-collapse{position:absolute;left:42px;top:17px;background:#fff;border:1px solid var(--border);box-shadow:0 2px 8px rgba(29,33,41,.08);z-index:2}
.side1.collapsed .new-task,
.side1.collapsed .nav-item,
.side1.collapsed .user-card{justify-content:center;margin-left:8px;margin-right:8px;padding-left:0;padding-right:0}
.side1.collapsed .new-task{width:40px}
.side1.collapsed .nav-item{gap:0}
.side1.collapsed .user-card{gap:0}

/* ================= 二级侧边栏 ================= */
.right{flex:1;display:flex;min-width:0}
.side2{width:216px;background:#FBFCFD;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:relative}
.side2-scroll{flex:1;overflow-y:auto;padding:12px 10px}
.sub-group{margin-bottom:16px}
.sub-group-head{display:flex;align-items:center;gap:7px;padding:7px 10px;font-size:13px;font-weight:500;color:var(--text)}
.sub-group-head svg{color:var(--primary-deep)}
.sub-group-head .cnt{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:400}
.sub-item{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 25px;border-radius:7px;color:var(--text-2);font-size:12.5px;cursor:pointer;user-select:none}
.sub-item:hover{background:#F2F3F6}
.sub-item.active{background:var(--primary-light);color:var(--primary-deep);font-weight:500}
.sub-item svg{color:#8A94A6;flex-shrink:0}
.sub-item.active svg{color:var(--primary-deep)}
.sub-item .cnt{margin-left:auto;font-size:11.5px;color:var(--text-3);font-weight:400}
.sub-item.active .cnt{color:var(--primary-deep)}
.side2-foot{padding:8px 10px}
.recycle-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;color:var(--text-2);font-size:12.5px;cursor:pointer;user-select:none}
.recycle-item:hover{background:#F2F3F6}
.recycle-item.active{background:var(--primary-light);color:var(--primary-deep);font-weight:500}
.side2-handle{position:absolute;right:-9px;top:46%;width:18px;height:46px;background:#fff;border:1px solid var(--border);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#B9BDC5;z-index:5;cursor:pointer;font-size:11px}
.side2-handle:hover{color:var(--primary)}

/* ================= 主区域 ================= */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0}
.topbar-title h1{font-size:15px;font-weight:600}
.topbar-title p{font-size:11px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.search-box{display:flex;align-items:center;gap:7px;background:#F5F6F8;border:1px solid transparent;border-radius:7px;padding:0 11px;height:32px;width:210px}
.search-box:focus-within{background:#fff;border-color:var(--primary)}
.search-box input{border:none;outline:none;background:transparent;font-size:12.5px;width:100%;color:var(--text)}
.ask-btn{display:flex;align-items:center;gap:5px;height:30px;padding:0 11px;background:var(--blue-light);border:1px solid var(--blue-border);color:var(--blue);border-radius:7px;font-size:12.5px;font-weight:500}
.ask-btn:hover{background:#E3EFFF}
.ask-btn kbd{font-size:10px;font-family:inherit;background:#fff;border:1px solid var(--blue-border);border-radius:3px;padding:0 4px;line-height:15px;font-weight:400}
.credits-pill{display:flex;align-items:center;gap:5px;color:var(--blue);font-size:12.5px;font-weight:500;padding:5px 8px;border-radius:7px;cursor:default}
.credits-pill.flash{animation:flash .5s}
@keyframes flash{0%{background:#CFE2FF}100%{background:transparent}}
.icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;color:var(--text-2)}
.icon-btn:hover{background:#F2F3F5}

#view{flex:1;overflow-y:auto;padding:14px 16px;min-height:0}
#view.fill{display:flex;flex-direction:column;overflow:hidden}
.statusbar{height:26px;background:#fff;border-top:1px solid #F0F1F3;display:flex;align-items:center;gap:26px;padding:0 16px;font-size:11px;color:var(--text-3);flex-shrink:0}
.sb-group{display:flex;align-items:center;gap:7px;white-space:nowrap}
.sb-ring{width:10px;height:10px;border-radius:50%;border:2px solid var(--primary);border-right-color:#E3E6EB;transform:rotate(-30deg)}

/* ================= 卡片 / 表格（与截图一致） ================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px}
.card-head{position:relative;padding:16px 16px 10px}
.card-title{font-size:14px;font-weight:600}
.card-desc{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.6}
.card-toggles{position:absolute;right:14px;top:14px;display:flex;gap:4px}
.card-toggles .icon-btn{width:28px;height:28px;border-radius:6px;color:var(--text-3)}
.card-toggles .icon-btn.on{color:var(--primary);background:var(--primary-light)}
.card-count{padding:0 16px 8px;font-size:12px;color:var(--text-3)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--text-3);font-weight:400;text-align:left;padding:9px 12px;border-top:1px solid #F0F1F3;border-bottom:1px solid #F0F1F3;white-space:nowrap}
.tbl td{padding:12px;font-size:13px;border-bottom:1px solid #F5F6F8;vertical-align:middle;white-space:nowrap}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#F8F9FA}
.tbl tbody tr.clickable{cursor:pointer}
.chk{width:14px;height:14px;border:1.5px solid #C9CDD4;border-radius:3px;display:inline-block;vertical-align:-2px;cursor:pointer;background:#fff}
.chk:hover{border-color:var(--primary)}
.xls{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;background:#1FA264;color:#fff;font-size:10px;font-weight:700;margin-right:8px;vertical-align:-5px;flex-shrink:0}
.file-cell{display:inline-flex;align-items:center;color:var(--text);font-weight:500;max-width:420px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
tr.clickable:hover .file-cell{color:var(--primary)}
.num-cell{font-variant-numeric:tabular-nums}
.enhanced-num{color:var(--primary);font-weight:600}
.pill-btn{height:24px;padding:0 12px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;display:inline-flex;align-items:center;gap:4px;font-weight:500;vertical-align:middle}
.pill-btn:hover{background:var(--primary-hover)}
.pill-btn.big{height:30px;padding:0 15px;font-size:12.5px}
.pill-btn svg{flex-shrink:0}
.txt-btn{color:var(--text-2);font-size:12.5px;padding:4px 8px;border-radius:5px;vertical-align:middle}
.txt-btn:hover{background:var(--primary-light);color:var(--primary)}
.txt-btn.danger:hover{background:var(--red-bg);color:var(--red)}
.op-icon-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-3);vertical-align:middle}
.op-icon-btn:hover{background:#F2F3F6;color:var(--text-2)}
.op-icon-btn.danger:hover{background:var(--red-bg);color:var(--red)}
.op-sep{color:#E3E6EB;margin:0 1px}

/* ================= 详情（Excel 预览） ================= */
.detail-wrap{display:flex;flex-direction:column;flex:1;min-height:0}
.detail-inner-head{padding:12px 16px 10px}
.detail-row1{display:flex;align-items:center;gap:6px}
.detail-row1 .spacer{flex:1}
.detail-title-row{display:flex;align-items:center;margin-top:8px;flex-wrap:wrap;gap:8px}
.detail-title{font-size:14px;font-weight:600;display:inline-flex;align-items:center}
.detail-meta{font-size:12px;color:var(--text-3)}
.detail-meta b{color:var(--text);font-weight:600}
.detail-meta .hl{color:var(--primary);font-weight:600}
.grid-toolbar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.grid-search{height:30px;width:220px;display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--border-dark);border-radius:7px;background:#fff;color:var(--text-3)}
.grid-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 2px rgba(65,78,255,.08)}
.grid-search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:12px}
.grid-filter{height:30px;max-width:180px;padding:0 28px 0 10px;border:1px solid var(--border-dark);border-radius:7px;background:#fff;color:var(--text-2);font:inherit;font-size:12px;outline:0}
.grid-filter:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(65,78,255,.08)}
.grid-reset{height:30px;padding:0 10px;border:1px solid var(--border-dark);border-radius:7px;color:var(--text-2);font-size:12px;background:#fff}
.grid-reset:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.grid-reset:disabled{color:#C4C8D0;background:#F7F8FA;cursor:not-allowed}
.grid-result-count{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
.grid-scroll{flex:1;overflow:auto;min-height:0;border-top:1px solid var(--border)}
table.grid{border-collapse:separate;border-spacing:0;min-width:1980px;width:100%}
.grid th{position:sticky;top:0;z-index:5;background:#F7F8FA;font-weight:500;color:var(--text-2);font-size:12px;padding:0 10px;height:38px;border-bottom:1px solid var(--border-dark);border-right:1px solid #F0F1F4;text-align:left;white-space:nowrap}
.grid td{padding:0 10px;height:46px;border-bottom:1px solid #F0F1F4;border-right:1px solid #F4F5F7;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff;max-width:230px}
.grid tbody tr:hover td{background:#F8F9FB}
.grid tbody tr:hover td.sticky1,.grid tbody tr:hover td.sticky2{background:#F8F9FB}
td.sticky1{position:sticky;left:0;z-index:4;width:48px;min-width:48px;text-align:center;color:var(--text-3)}
td.sticky2{position:sticky;left:48px;z-index:4;box-shadow:5px 0 6px -5px rgba(0,0,0,.07)}
th.sticky1{position:sticky;left:0;z-index:6;width:48px;min-width:48px;text-align:center}
th.sticky2{position:sticky;left:48px;z-index:6;box-shadow:5px 0 6px -5px rgba(0,0,0,.07)}
.grid-sort-btn{width:100%;height:38px;display:flex;align-items:center;justify-content:flex-start;gap:5px;color:inherit;font-size:12px;white-space:nowrap}
.grid-sort-btn:hover{color:var(--primary)}
th.sticky1 .grid-sort-btn{justify-content:center}
.sort-indicator{font-size:11px;color:#B5BAC3;line-height:1}
.grid-sort-btn.active .sort-indicator{color:var(--primary)}
.grid-empty{text-align:center!important;color:var(--text-3)!important;padding:52px 20px!important;height:auto!important;background:#fff!important}
.co-name{font-weight:500;color:var(--text)}
.link{color:var(--blue);text-decoration:none}
.link:hover{text-decoration:underline}
.grade-tag{font-size:11px;border-radius:4px;padding:1px 8px;font-weight:600}
.grade-A{background:#FEF2F2;color:#DC2626}
.grade-B{background:#FFF7E6;color:#D97706}
.grade-C{background:#F0F5FF;color:#2F54EB}
.icp-num{font-weight:600;font-variant-numeric:tabular-nums}
.enhanced-tag{font-size:10.5px;color:var(--green);background:var(--green-bg);border:1px solid var(--green-border);border-radius:4px;padding:0 6px;line-height:17px;margin-left:7px;white-space:nowrap}
th.hv-head{background:#F6F8FF}
.hv-head-inner{display:flex;align-items:center;gap:5px}
.hv-head-inner .lock-ico{color:var(--primary)}
.price-tag{font-size:10px;color:var(--primary-deep);background:var(--primary-light);border-radius:4px;padding:1px 5px;font-weight:400}
.col-unlock-btn{border:1px solid var(--primary-border);background:#fff;color:var(--primary);border-radius:5px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;margin-left:2px}
.col-unlock-btn:hover{background:var(--primary);color:#fff}
.lock-cell{display:flex;align-items:center;gap:7px}
.lock-mask{color:#B9BDC5;display:inline-flex;align-items:center;gap:4px;letter-spacing:1px}
.unlock-btn{height:22px;padding:0 9px;font-size:11px;border:1px solid var(--primary);color:var(--primary);background:#fff;border-radius:999px;flex-shrink:0}
.unlock-btn:hover{background:var(--primary);color:#fff}
.hv-val{color:var(--text)}
.cell-empty{color:var(--text-3);font-size:12px}
.cell-fail{color:var(--red);font-size:12px;margin-right:6px}
.mini-link{color:var(--primary);font-size:12px;padding:0;text-decoration:underline}
.cell-querying{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px}
.spinner{width:13px;height:13px;border:2px solid #E3E6EB;border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.row-unlock-btn{height:25px;padding:0 10px;font-size:11.5px;border-radius:999px;border:1px solid var(--primary-border);background:var(--primary-light);color:var(--primary);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.row-unlock-btn:hover{background:#DDE3FF}
.row-done{font-size:11.5px;color:var(--green)}
.row-none{color:var(--text-3)}
.sheet-tabs{display:flex;background:#FAFBFC;border-top:1px solid var(--border);padding:0 10px;flex-shrink:0}
.sheet-tab{padding:9px 18px 8px;font-size:12.5px;color:var(--text-2);cursor:pointer;border-top:2px solid transparent;user-select:none;display:flex;align-items:center;gap:6px}
.sheet-tab:hover{color:var(--text)}
.sheet-tab.active{background:#fff;color:var(--primary);border-top-color:var(--primary);font-weight:500;border-left:1px solid #F0F1F4;border-right:1px solid #F0F1F4;margin-bottom:-1px}
.sheet-tab .cnt{font-size:11px;color:var(--text-3)}
.sheet-tab.active .cnt{color:var(--primary)}

/* ================= 弹窗 / Toast ================= */
.modal-mask{position:fixed;inset:0;background:rgba(18,22,30,.45);display:flex;align-items:center;justify-content:center;z-index:100;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:450px;max-width:92vw;background:#fff;border-radius:10px;padding:20px 22px;box-shadow:0 16px 48px rgba(0,0,0,.18);animation:pop .16s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:15px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.modal h3 .lock-ico{color:var(--primary)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px dashed #F0F1F4;gap:14px}
.kv span{color:var(--text-3);flex-shrink:0;min-width:88px}
.kv b{font-weight:500;flex:1;min-width:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b.cost{color:var(--gold-text);font-weight:600}
.field-line{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:5px 2px;color:var(--text-2);gap:14px}
.field-line span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-line b{font-weight:500;color:var(--text);flex-shrink:0}
.modal-note{background:#F8F9FB;border-radius:7px;padding:10px 13px;font-size:12px;color:var(--text-2);line-height:1.7;margin-top:12px}
.insufficient{background:var(--red-bg);color:#DC2626;border-radius:7px;padding:9px 13px;font-size:12.5px;margin-top:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn{height:32px;padding:0 15px;border-radius:7px;font-size:12.5px;border:1px solid var(--border-dark);background:#fff;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--red);border-color:#F5C6C6}
.btn.danger:hover{background:var(--red-bg);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.batch-list{max-height:170px;overflow-y:auto;margin-top:8px;border:1px solid #F0F1F4;border-radius:7px;padding:4px 10px}
#toastRoot{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#fff;border:1px solid var(--border);border-left:3px solid var(--green);box-shadow:0 8px 28px rgba(0,0,0,.13);border-radius:8px;padding:10px 18px;font-size:13px;animation:slideDown .22s;max-width:520px}
.toast.warn{border-left-color:#F59E0B}
.toast.err{border-left-color:var(--red)}
.toast.info{border-left-color:var(--primary)}
@keyframes slideDown{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
.empty-state{padding:80px 0;text-align:center;color:var(--text-3)}
.empty-state .big{font-size:14px;color:var(--text-2);margin:14px 0 6px;font-weight:500}
.empty-ico{width:64px;height:64px;border-radius:16px;background:#F2F3F6;display:inline-flex;align-items:center;justify-content:center;color:#C4C9D1}
.mascot{position:fixed;right:16px;bottom:16px;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#FFC9D9,#FF9EBB);box-shadow:0 4px 14px rgba(255,158,187,.55);display:flex;align-items:center;justify-content:center;z-index:60;cursor:pointer}
.mascot:hover{transform:scale(1.06)}
.demo-mark{position:fixed;left:50%;bottom:4px;transform:translateX(-50%);font-size:10px;color:#C6CAD1;z-index:40;user-select:none;pointer-events:none}

/* TABLE_CONTROL_MODEL_START */
function gridSearchText(lead, cols){
  return cols.flatMap(col => {
    if (col.k === 'op') return [];
    if (col.k === 'hv'){
      const cell = lead.hv?.[col.f];
      return cell?.s === 'unlocked' ? [cell.v ?? ''] : [];
    }
    return [lead[col.k] ?? ''];
  }).join(' ').toLocaleLowerCase();
}

function applyGridControls(rows, cols, controls){
  const query = String(controls.query ?? '').trim().toLocaleLowerCase();
  const enhanced = lead => Object.values(lead.hv ?? {}).some(cell => cell?.s === 'unlocked');
  const result = rows.filter(lead =>
    (!query || gridSearchText(lead, cols).includes(query)) &&
    (!controls.grade || lead.grade === controls.grade) &&
    (!controls.industry || lead.industry === controls.industry) &&
    (!controls.enhanced || (controls.enhanced === 'yes') === enhanced(lead))
  );
  if (!controls.sortKey || !controls.sortDir) return result;
  const numeric = new Set(['no', 'icp']);
  const direction = controls.sortDir === 'desc' ? -1 : 1;
  return result.slice().sort((left, right) => {
    const a = left[controls.sortKey], b = right[controls.sortKey];
    const aEmpty = a === '' || a === null || a === undefined;
    const bEmpty = b === '' || b === null || b === undefined;
    if (aEmpty || bEmpty) return aEmpty === bEmpty ? 0 : (aEmpty ? 1 : -1);
    const comparison = numeric.has(controls.sortKey)
      ? Number(a) - Number(b)
      : String(a).localeCompare(String(b), 'zh-CN', { numeric: true, sensitivity: 'base' });
    return comparison * direction;
  });
}

function nextGridSort(sortKey, sortDir, key){
  if (sortKey !== key) return { sortKey: key, sortDir: 'asc' };
  if (sortDir === 'asc') return { sortKey: key, sortDir: 'desc' };
  return { sortKey: '', sortDir: '' };
}

function hasActiveGridControls(controls){
  return Boolean(controls.query || controls.grade || controls.industry || controls.enhanced || controls.sortKey || controls.sortDir);
}

function hvCell(lead, field){
  const c = lead.hv[field];
  if (c.s === 'unlocked'){
    const val = field === 'linkedin'
      ? `<a class="link" href="#" onclick="event.preventDefault();toast('原型演示：跳转 LinkedIn','info')">${c.v}</a>`
      : (field === 'email' ? `<a class="link" href="#" onclick="event.preventDefault()">${c.v}</a>` : `<span class="hv-val">${c.v}</span>`);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function cellHtml(l, c){
  if (c.k === 'no') return l.no;
  if (c.k === 'company') return `<span class="co-name" title="${esc(l.company)}">${esc(l.company)}</span>${isEnhanced(l) ? '<span class="enhanced-tag">已增强</span>' : ''}`;
  if (c.k === 'site'){ const d = l.site.replace(/^https?:\/\//,'').replace(/\/$/,''); return d ? `<a class="link" href="#" onclick="event.preventDefault()">${esc(d)}</a>` : '—'; }
  if (c.k === 'icp') return `<span class="icp-num" style="color:${l.icp>=90?'var(--primary)':l.icp>=75?'var(--blue)':'var(--text-2)'}">${l.icp}</span>`;
  if (c.k === 'grade') return `<span class="grade-tag grade-${l.grade}">${l.grade}</span>`;

}

function gridHeaderHTML(col, index){
  if (col.k === 'hv') return hvHead(col.f);
  const className = index === 0 ? 'sticky1' : (index === 1 ? 'sticky2' : '');
  const classAttr = className ? ` class="${className}"` : '';
  const styleAttr = col.min ? ` style="min-width:${col.min}px"` : '';
  if (col.k === 'op') return `<th${classAttr}${styleAttr}>${col.t}</th>`;
  const active = state.gridSortKey === col.k;
  const ariaSort = active ? (state.gridSortDir === 'asc' ? 'ascending' : 'descending') : 'none';
  const indicator = active ? (state.gridSortDir === 'asc' ? '↑' : '↓') : '↕';
  return `<th${classAttr}${styleAttr} aria-sort="${ariaSort}">
    <button class="grid-sort-btn${active ? ' active' : ''}" type="button" onclick="toggleGridSort('${col.k}')" title="点击排序：升序、降序、默认顺序">
      ${col.t}<span class="sort-indicator" aria-hidden="true">${indicator}</span>

}

function gridHTML(){
  const isN = state.sheet === 'nocontact';
  const cols = isN ? COLS_N : COLS_C;
  const head = cols.map(gridHeaderHTML).join('');
  const visibleLeads = filteredGridLeads();
  const body = visibleLeads.map(l => '<tr>' + cols.map((c, i) =>
    `<td${i === 0 ? ' class="sticky1"' : (i === 1 ? ' class="sticky2"' : '')}>${cellHtml(l, c)}</td>`).join('') + '</tr>').join('');
  const empty = `<tr><td class="grid-empty" colspan="${cols.length}">没有符合当前条件的线索</td></tr>`;
  return `<table class="grid" style="min-width:${isN ? 3000 : 3800}px"><thead><tr>${head}</tr></thead><tbody>${body || empty}</tbody></table>`;
}

/* ================================================================
 * 解锁流程（PRD 7.3 / 7.4 / 7.5 / 11）
 * ================================================================ */
function tryUnlock(id, field){
  if (state.busy) return;
  const lead = getLead(id), c = lead.hv[field];
  if (c.s !== 'locked' && c.s !== 'failed') return;
  const price = FIELD_PRICES[field];
  const enough = state.credits >= price;
  openModal(`
    <h3>${ICO.lock}解锁高价值字段</h3>
    <div class="kv"><span>联系人所在公司</span><b title="${lead.company}">${lead.company}</b></div>
    <div class="kv"><span>解锁字段</span><b>${FIELD_LABELS[field]}</b></div>
    <div class="kv"><span>字段单价</span><b class="cost">${price} Credits</b></div>
    <div class="kv"><span>当前余额</span><b>${fmt(state.credits)} Credits</b></div>
    <div class="modal-note">仅在成功获得有效数据后扣除 Credits，未查询到有效数据不扣费。<br>解锁成功后，企业内具有数据权限的成员均可查看，不重复扣费。</div>
    ${enough ? '' : `<div class="insufficient">Credits 余额不足：本次解锁需 ${price} Credits，当前余额 ${fmt(state.credits)}，请先充值后再试。</div>`}
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" ${enough ? '' : 'disabled'} onclick="doUnlock(${id},'${field}')">确认解锁</button>
    </div>`);
}

function resolveCell(lead, field){
  const c = lead.hv[field];
  const price = FIELD_PRICES[field];
  if (c.outcome === 'empty'){
    c.s = 'empty';
    return { type: 'empty' };
  }
  if (c.outcome === 'failOnce' && !c.tried){
    c.tried = true; c.s = 'failed';
    return { type: 'failed' };
  }
  c.s = 'unlocked';
  state.credits -= price;
  updateCredits();
  return { type: 'ok', price };
}

function doUnlock(id, field){
  closeModal();
  const lead = getLead(id), c = lead.hv[field];
  c.s = 'querying';
  refreshGrid();
  setTimeout(() => {
    const r = resolveCell(lead, field);
    refreshGrid();
    if (r.type === 'ok') toast(`解锁成功：已扣除 ${r.price} Credits`);
    else if (r.type === 'empty') toast('查询完成：未获得有效数据，已标记为空值（不扣费，且不再支持手动增强）', 'info');
    else toast('查询失败：接口超时，未扣除 Credits，可点击重试', 'err');
  }, 900 + Math.random() * 600);
}

function batchModal(title, targets, scopeDesc, onConfirm){
  const total = targets.reduce((s, t) => s + FIELD_PRICES[t.field], 0);
  const enough = state.credits >= total;
  const lines = targets.slice(0, 8).map(t =>
    `<div class="field-line"><span title="${t.lead.company}">${t.lead.company} · ${FIELD_LABELS[t.field]}</span><b>${FIELD_PRICES[t.field]} Credits</b></div>`).join('')
    + (targets.length > 8 ? `<div class="field-line" style="color:var(--text-3)">… 等共 ${targets.length} 个冻结字段</div>` : '');
  openModal(`
    <h3>${ICO.bolt}${title}</h3>
    <div class="kv"><span>操作范围</span><b>${scopeDesc}</b></div>
    <div class="kv"><span>预计最高消耗</span><b class="cost">${fmt(total)} Credits</b></div>
    <div class="kv"><span>当前余额</span><b>${fmt(state.credits)} Credits</b></div>
    <div class="batch-list">${lines}</div>
    <div class="modal-note">仅对<b>成功获得有效值</b>的字段扣除 Credits，未解锁成功的字段不扣费。</div>
    ${enough ? '' : `<div class="insufficient">余额不足以覆盖预计最高消耗（${fmt(total)} Credits），本次批量操作已整体阻断，请先充值。</div>`}
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn primary" ${enough && targets.length ? '' : 'disabled'} onclick="${onConfirm}">确认解锁（${targets.length} 个字段）</button>
    </div>`);
}

function tryUnlockRow(id){
  if (state.busy) return;
  const lead = getLead(id);
  const targets = rowTargets(lead).map(f => ({ lead, field: f }));
  if (!targets.length) return;
  batchModal('一键解锁本行', targets, `${lead.company} · ${targets.length} 个冻结字段`, `runBatch(${id},null)`);
}
function tryUnlockCol(field){
  if (state.busy) return;
  const targets = sheetLeads().filter(l => l.hv[field] && (l.hv[field].s === 'locked' || l.hv[field].s === 'failed')).map(l => ({ lead: l, field }));
  if (!targets.length){ toast('当前 Sheet 内该列没有可解锁的冻结字段', 'info'); return; }
  const sheetName = state.sheet === 'gradeA' ? '高潜A级客户' : '线索总表';
  batchModal(`一键解锁本列 · ${FIELD_LABELS[field]}`, targets, `当前 Sheet「${sheetName}」· ${targets.length} 个冻结字段`, `runBatch(null,'${field}')`);
}

function runBatch(rowId, colField){
  closeModal();
  let targets;
  if (rowId !== null){
    const lead = getLead(rowId);
    targets = rowTargets(lead).map(f => ({ lead, field: f }));
  } else {
    targets = sheetLeads().filter(l => l.hv[colField] && (l.hv[colField].s === 'locked' || l.hv[colField].s === 'failed')).map(l => ({ lead: l, field: colField }));
  }
  state.busy = true;
  targets.forEach(t => { t.lead.hv[t.field].s = 'querying'; });
  refreshGrid();
  let ok = 0, empty = 0, failed = 0, cost = 0;
  targets.forEach((t, i) => {
    setTimeout(() => {
      const r = resolveCell(t.lead, t.field);
      if (r.type === 'ok'){ ok++; cost += r.price; }
      else if (r.type === 'empty') empty++;
      else failed++;
      refreshGrid();
      if (i === targets.length - 1){
        state.busy = false;
        toast(`批量解锁完成：成功 ${ok} · 空值 ${empty} · 失败 ${failed}，实际消耗 ${fmt(cost)} Credits`, ok ? '' : (failed ? 'err' : 'info'));
      }
    }, 700 + i * 420);
  });
}

    render();

      <thead><tr><th style="width:42%">文件名</th><th>删除人</th><th>删除时间</th><th>保留期</th><th style="width:110px">操作</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:44px">回收站为空</td></tr>'}</tbody>
    </table>
  </div>`;
}
function restoreFile(i){
  const r = recycled[i];
  recycled.splice(i, 1);
  FILES.push({ id: Date.now(), name: r.name, creator: r.by, created: '2026-06-18 09:40', updated: '2026-07-05 16:20', agent: '海外线索 Agent', staticLeads: 15, staticEnhanced: 3 });
  render();
  toast('已恢复至商机线索列表，原解锁状态与企业权益全部保留', '');
}

function viewNotes(){
  const nameMap = { 'notes-meeting': '会议笔记', 'notes-flash': '闪念笔记', 'notes-ent-meeting': '会议笔记' };
  return `<div class="card"><div class="empty-state">
    <span class="empty-ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>
    <div class="big">${nameMap[state.view] || '笔记'}（原型占位）</div>
    <div>本原型聚焦「商机线索」模块，请点击左侧「商机线索」入口体验完整流程</div>
  </div></div>`;
}

/* 初始化 */
render();
</script>
